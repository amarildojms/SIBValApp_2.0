name: sibval_app_2_0
description: "SIB Val App 2.0 — migração para Flutter (Android + iOS)."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
# build-number (depois do "+") precisa ser maior que o maior versionCode já
# publicado para com.sibval.app na Play Console — confirme o valor real na
# Play Console antes de enviar; se for maior que 42, ajuste aqui e gere o
# AAB de novo. Novidade desta versão (02/09/2026): reforma do Início —
# virou um painel-resumo (saudação + versículo do dia, grade de acesso
# rápido quadrada com Bíblia/Ordem de Culto/Oração/Mensagens + EBD/Agenda/
# PGMs "Em breve", cards "Próximo na Igreja"/"Devocional de Hoje" com a
# imagem padrão de Devocionais/"Minha EBD"/"Esta Semana"+"Avisos" lado a
# lado); o feed de publicações (Mural) saiu do Início e virou uma tela
# própria dentro de Mais; barra inferior reduzida pra Início/Devocionais/
# Eventos/Contribua (Mural e Mais saíram dela).
version: 1.7.2+43

environment:
  sdk: ^3.13.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.0.5
  google_sign_in: ^7.2.0
  image_picker: ^1.2.0
  flutter_riverpod: ^3.4.2
  intl: ^0.20.3
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  sqflite: ^2.4.3
  path: ^1.9.1
  xml: ^7.0.1
  image_cropper: ^12.2.1
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.3.0
  # Preso em ^12.0.0 (não a última, ^13.x): permission_handler_android 14.x
  # (puxado por permission_handler >=13.0.0) exige compileSdk 37, que a Android
  # SDK Platform aqui instala como pasta "android-37.0" — o Gradle procura o
  # alvo "android-37" e não acha, falhando o build. permission_handler_android
  # 13.x (via ^12.0.0) só pede compileSdk 35, dentro do compileSdk 36 do
  # projeto (flutter.compileSdkVersion). Revisar quando o SDK 37 estabilizar.
  permission_handler: ^12.0.0
  # Busca de endereço por CEP (ViaCEP) no cadastro/edição de perfil.
  http: ^1.2.0
  # Versão instalada do app, comparada com a mínima exigida (ver update_gate.dart).
  package_info_plus: ^10.2.1
  # Importar arquivo .txt de cifra (28/08/2026, pedido do usuário) — ver
  # cifra_editor_page.dart.
  file_picker: ^12.1.2
  brcode: ^0.0.4
  qr_flutter: ^4.1.0
  diacritic: ^0.1.6
  syncfusion_flutter_calendar: ^34.2.6
  # Localização pt-BR nativa do Syncfusion (textos como "Sem eventos", "Hoje")
  # para a Agenda dos ministérios — 03/09/2026.
  syncfusion_localizations: ^34.2.6
dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Gera os ícones de launcher (mipmap ic_launcher) a partir do emblema
# cruz+peixe — rodar com `dart run flutter_launcher_icons` sempre que os
# arquivos em assets/icon_source mudarem. Ícone trocado em 20/08/2026 para a
# versão com fundo branco (antes era o emblema sobre fundo azul-marinho);
# adaptive_icon_background acompanha o branco do novo arquivo para não sobrar
# borda azul no ícone com máscara adaptável (círculo/squircle) do launcher.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon_source/legacy.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon_source/foreground.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/bible/alm1911.sqlite
    - assets/hymnals/cc.sqlite
    - assets/hymnals/hcc.sqlite
    - assets/images/logo.png
    - assets/images/icon_sibval.png
    - assets/icons/ic_devocional.png
    - assets/icons/ic_prayer.png
    - assets/icons/ic_cc.png
    - assets/icons/ic_hcc.png
    - assets/images/partners/convencao_batista_brasileira.png
    - assets/images/partners/convencao_batista_planalto_central.png
    - assets/images/partners/ordem_pastores_batistas.png
    - assets/images/partners/missoes_nacionais.png
    - assets/images/partners/missoes_mundiais.png
    - assets/images/partners/cristolandia.png
    - assets/images/partners/rede_316.png

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
